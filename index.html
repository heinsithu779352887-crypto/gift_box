<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<style>
    body {
        margin: 0%;
        min-height: 100vh;
        display: block;
        justify-content: center;
        align-items: center;
        background-image: url(/static/photo/6.jpg);
        background-size: 1125px 1125px;
        background-position: center;
        background-repeat: no-repeat;
        text-align: center;
        color: rgb(70, 60, 60);
        margin-bottom: 1px;
    }

    .g {
        font-size: 30px;
        font-weight: bolder;
        position: absolute;
        top: 100px;
        left: 310px;
        background-color: silver;
        color: rgb(70, 60, 60);
        border-radius: 15px;
        border: none;
        height: 60px;
        width: 500px;
    }

    .tap {
        font-weight: bolder;
        color: rgb(70, 60, 60);
        font-size: 25px;
        width: 150px;
        height: 50px;
        border: none;
        border-radius: 15px;
        background: silver;
        font-size: 25px;
        cursor: pointer;
        transition: 0.3s;
        justify-content: space-between;
    }

    .tap:hover {
        transform: scale(1.3);
        background-color: white;
        color: rgb(126, 118, 118);
    }

    #tap1 {
        position: absolute;
        left: 250px;
        top: 300px;
    }

    #tap2 {
        position: absolute;
        right: 250px;
        top: 300px;
    }
</style>

<body>
    <button class="g">သီတင်းကျွတ်လက်ဆောင် </button><br>
    <a class="tap" id="tap1" href="g0.html">ယူမယ်</a>
    <a class="tap" id="tap2" href="/no.html">မယူဘူး</a>

</body>

</html>
